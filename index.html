<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Birthday Wishlist 🎀</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
   <header class="header">

    <h1>🎂 Lalli's 20th Birthday 🎀</h1>

    <p>A little wishlist of things I might love ♡</p>

</header>
    
    <!-- Search -->
    <section class="search-section">

        <input
            type="text"
            id="search"
            placeholder="🔍 Search my wishlist..."
        >

    </section>


    <!-- Categories -->
    <nav class="categories">

    <button
        class="category-btn active"
        data-category="all"
    >
        All
    </button>


    <button
        class="category-btn"
        data-category="clothing"
    >
        👗 Clothing
    </button>


    <button
        class="category-btn"
        data-category="footwear"
    >
        👟 Footwear
    </button>


    <button
        class="category-btn"
        data-category="accessories"
    >
        ⌚ Accessories
    </button>


    <button
        class="category-btn"
        data-category="craft"
    >
        🎨 Craft / Others
    </button>

</nav>


  <!-- Products -->
<div class="product-controls">

    <p id="product-count">
        0 items
    </p>

    <select id="sort-select">

        <option value="featured">
            Featured
        </option>

        <option value="price-low">
            Price: Low → High
        </option>

        <option value="price-high">
            Price: High → Low
        </option>

        <option value="priority">
            Priority
        </option>

    </select>

</div>


<main class="products" id="products-container">

</main>
    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>

</html>
